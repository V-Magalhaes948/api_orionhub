services:
  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: mysql:8
    restart: unless-stopped
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: qiejqodqdqudhqdq
      MYSQL_DATABASE: api_zapFlow
    volumes:
      - db_data:/var/lib/mysql

  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api

volumes:
  db_data:
