name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        working-directory: backend
        run: npm ci

      - name: Rodar testes unitários
        working-directory: backend
        run: npm test

  integration:
    runs-on: ubuntu-latest
    needs: unit # só sobe banco/redis se os testes rápidos já passaram

    services:
      db:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: orionhub_test
          MYSQL_USER: orionhub_test_user
          MYSQL_PASSWORD: orionhub_test_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a test_redis_pass ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        working-directory: backend
        run: npm ci

      - name: Rodar migrations
        working-directory: backend
        run: npx sequelize-cli db:migrate
        env:
          NODE_ENV: test
          DATABASE: orionhub_test
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 3306
          DATABASE_USERNAME: orionhub_test_user
          DATABASE_PASSWORD: orionhub_test_pass

      - name: Rodar testes de integração
        working-directory: backend
        run: npm run test:integration
        env:
          NODE_ENV: test
          DATABASE: orionhub_test
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 3306
          DATABASE_USERNAME: orionhub_test_user
          DATABASE_PASSWORD: orionhub_test_pass
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_PASSWORD: ''
          REDIS_DB: 0
          WEBHOOK_SECRET: test-webhook-secret
          TOKEN_SECRET: test-token-secret
          REFRESH_TOKEN_SECRET: test-refresh-secret
