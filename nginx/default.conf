# ── Bloco 1: HTTP → redireciona tudo pra HTTPS ──────────────────────────
server {
    listen 80;
    server_name orionhub.space www.orionhub.space;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Bloco 2: HTTPS — tráfego real da aplicação ──────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name orionhub.space www.orionhub.space;

    ssl_certificate     /etc/letsencrypt/live/orionhub.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orionhub.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 10M;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1024;

    # ── API: tudo que começa com /api vai pro backend ──────────────────
    location /api/ {
        proxy_pass http://api:3001/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }

    # ── Frontend: todo o resto vai pro container do React ───────────────
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
