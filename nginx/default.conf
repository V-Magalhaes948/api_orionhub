# ── Bloco 1: HTTP → redireciona tudo pra HTTPS ──────────────────────────
server {
    listen 80;
    server_name seudominio.com www.seudominio.com;

    # necessário pro certbot renovar o certificado via HTTP challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Bloco 2: HTTPS — tráfego real da aplicação ──────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name seudominio.com www.seudominio.com;

    ssl_certificate     /etc/letsencrypt/live/seudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seudominio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # limite de upload — casa com o que Multer/sharp esperam receber.
    # ajusta o valor conforme o maior arquivo que seu upload de imagem aceita.
    client_max_body_size 10M;

    # gzip — reduz payload de respostas JSON grandes (listagens de produtos, etc)
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1024;

    location / {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;

        # WebSocket (Socket.IO) — você já tinha isso certo
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        # headers que faltavam — CRÍTICO: sem isso, req.ip no Express
        # sempre retorna o IP do Nginx, quebrando rate limit e bloqueio
        # de conta por tentativas falhas por IP individual do usuário.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # timeouts — evita que uploads grandes ou respostas mais lentas
        # (ex: processamento de imagem no sharp) sejam cortados no meio
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # buffer — payloads JSON maiores (ex: listagem de produtos com
        # metadata) não ficam sendo escritos em disco temporário
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }
}

